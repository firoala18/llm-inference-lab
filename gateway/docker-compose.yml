# The platform stack: LiteLLM proxy + Postgres (governance) and
# Prometheus + Grafana (observability).
# Start:  docker compose up -d      Logs: docker compose logs -f litellm
# Stop:   docker compose down       (add -v to also wipe the database volume)
# UIs:    Grafana http://localhost:3000  Prometheus http://localhost:9090
services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    ports:
      - "4000:4000"                          # host:container — clients talk to localhost:4000
    volumes:
      - ./config.yaml:/app/config.yaml:ro    # :ro = read-only, the container cannot alter our config
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file: .env                           # secrets + pod URL, never committed
    environment:
      DATABASE_URL: postgresql://litellm:litellm@db:5432/litellm
      STORE_MODEL_IN_DB: "True"
    depends_on:
      db:
        condition: service_healthy           # wait for a READY database, not just a started one
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm             # lab-local only; never a real deployment password
      POSTGRES_DB: litellm
    volumes:
      - pgdata:/var/lib/postgresql/data      # named volume → keys survive `compose down`
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ../monitoring/targets:/etc/prometheus/targets:ro   # pod URLs, gitignored (file SD)
      - promdata:/prometheus                               # metric history survives restarts
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin    # lab-local only
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus                         # plain depends_on: Grafana retries on its own
    restart: unless-stopped

volumes:
  pgdata: {}
  promdata: {}
  grafanadata: {}
