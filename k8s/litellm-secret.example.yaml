# Template — copy to litellm-secret.yaml (gitignored) and fill in real values.
# The K8s translation of the compose `env_file: .env`.
# stringData lets us write plain text; the API server stores it base64-encoded.
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: llm-lab
type: Opaque
stringData:
  VLLM_API_BASE: "https://<POD_ID>-8000.proxy.runpod.net/v1"
  VLLM_API_BASE_SMALL: "https://<POD_ID>-8002.proxy.runpod.net/v1"
  VLLM_API_KEY: "sk-lab-..."
  LITELLM_MASTER_KEY: "sk-master-..."
